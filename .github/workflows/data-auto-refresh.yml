name: Auto Refresh Financial Data

on:
  workflow_dispatch:
  schedule:
    # Daily baseline at 18:15 China Standard Time / 05:15-06:15 US Eastern Time.
    # Yahoo's adjusted-close bar can lag the US close by several hours, so the
    # next-morning run avoids publishing a dataset that silently ends a day early.
    - cron: "15 10 * * *"
    # European issuers such as ASML publish after the baseline run. During the
    # main quarterly reporting months, poll again at 16:15 China Standard Time.
    - cron: "15 8 * 1,4,7,10 *"

permissions:
  contents: write

concurrency:
  group: auto-refresh-data
  cancel-in-progress: false

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Refresh data.js
        run: node scripts/auto-refresh-data.mjs

      - name: Refresh price-data.js
        run: node scripts/auto-refresh-price-data.mjs

      - name: Commit changes if data updated
        run: |
          if git diff --quiet -- data.js price-data.js; then
            echo "No data update."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js price-data.js
          git commit -m "chore(data): auto refresh dashboard datasets"
          git push
