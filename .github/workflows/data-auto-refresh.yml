name: Auto Refresh Financial Data

on:
  workflow_dispatch:
    inputs:
      prices_only:
        description: Refresh prices without refreshing financial datasets
        type: boolean
        default: false
  schedule:
    # Price-only run 85–145 minutes after the regular US close.
    - cron: "25 22 * * 1-5"
    # Retry unverified closes at 09:15 Beijing time after each US weekday.
    - cron: "15 1 * * 2-6"
    # Daily full refresh also retries prices that were unavailable after close.
    - cron: "15 10 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-refresh-data
  cancel-in-progress: false

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    env:
      PRICE_ONLY: ${{ inputs.prices_only || github.event.schedule == '25 22 * * 1-5' || github.event.schedule == '15 1 * * 2-6' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Refresh data.js
        if: env.PRICE_ONLY != 'true'
        id: financials
        continue-on-error: true
        run: node scripts/auto-refresh-data.mjs

      - name: Refresh market capitalizations
        if: env.PRICE_ONLY != 'true'
        id: marketcaps
        continue-on-error: true
        run: node scripts/auto-refresh-market-caps.mjs

      - name: Refresh cash-flow data
        if: env.PRICE_ONLY != 'true'
        id: cashflow
        continue-on-error: true
        run: node scripts/auto-refresh-cash-flow.mjs

      - name: Check coverage of recent financial reports
        if: env.PRICE_ONLY != 'true'
        id: coverage_probe
        continue-on-error: true
        run: node scripts/earnings-watch.mjs --verify-coverage

      - name: Recover missing actuals from official earnings releases
        if: steps.coverage_probe.outcome == 'failure'
        id: earnings_recovery
        continue-on-error: true
        uses: ./.github/actions/sync-earnings

      - name: Refresh price-data.js
        id: prices
        continue-on-error: true
        env:
          RETRY_UNVERIFIED: ${{ github.event.schedule == '15 1 * * 2-6' }}
        run: |
          args=(--allow-partial --defer-pending-close)
          if [ "$RETRY_UNVERIFIED" = true ]; then args+=(--only-unverified); fi
          node scripts/auto-refresh-price-data.mjs "${args[@]}"

      - name: Commit changes if data updated
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data.js price-data.js data/cash-flow-history.json data/cash-flow-coverage.json; then
            echo "No data update."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/version-pages-data.mjs .
          git add data.js price-data.js data/cash-flow-history.json data/cash-flow-coverage.json index.html
          git commit -m "chore(data): auto refresh dashboard datasets"
          git push
          # Explicitly publish bot commits; token pushes do not trigger Actions.
          gh workflow run pages.yml --ref main

      - name: Surface incomplete refreshes after publishing valid data
        if: always()
        env:
          FINANCIALS: ${{ steps.financials.outcome }}
          MARKETCAPS: ${{ steps.marketcaps.outcome }}
          CASHFLOW: ${{ steps.cashflow.outcome }}
          COVERAGE: ${{ steps.coverage_probe.outcome }}
          EARNINGS_RECOVERY: ${{ steps.earnings_recovery.outcome }}
          PRICES: ${{ steps.prices.outcome }}
          PENDING_PRICES: ${{ steps.prices.outputs.pending }}
          DEFERRED_PRICES: ${{ steps.prices.outputs.deferred }}
        run: |
          echo "Financials: $FINANCIALS; market caps: $MARKETCAPS; cash flow: $CASHFLOW; initial coverage: $COVERAGE; earnings recovery: $EARNINGS_RECOVERY; prices: $PRICES" >> "$GITHUB_STEP_SUMMARY"
          test "$FINANCIALS" = success || test "$FINANCIALS" = skipped
          test "$MARKETCAPS" = success || test "$MARKETCAPS" = skipped
          test "$CASHFLOW" = success || test "$CASHFLOW" = skipped
          if [ "$COVERAGE" = failure ]; then
            test "$EARNINGS_RECOVERY" = success
            node scripts/earnings-watch.mjs --verify-coverage
          fi
          test "$PRICES" = success
          if [ -n "$PENDING_PRICES" ]; then
            echo "Pending verified closes: $PENDING_PRICES" >> "$GITHUB_STEP_SUMMARY"
            if [ "$DEFERRED_PRICES" = true ]; then
              echo '::warning::Nasdaq close publication is pending. The next recovery run retries missing closes.'
            else
              echo '::error::Closing prices remain unverified after the recovery window.'
              exit 1
            fi
          fi
