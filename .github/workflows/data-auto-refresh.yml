name: Auto Refresh Financial Data

on:
  workflow_dispatch:
    inputs:
      prices_only:
        description: Refresh prices without refreshing financial datasets
        type: boolean
        default: false
  schedule:
    # Price-only run 85–145 minutes after the regular US close.
    - cron: "25 22 * * 1-5"
    # Daily full refresh also retries prices that were unavailable after close.
    - cron: "15 10 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-refresh-data
  cancel-in-progress: false

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Refresh data.js
        if: github.event.schedule != '25 22 * * 1-5' && !inputs.prices_only
        id: financials
        continue-on-error: true
        run: node scripts/auto-refresh-data.mjs

      - name: Refresh market capitalizations
        if: github.event.schedule != '25 22 * * 1-5' && !inputs.prices_only
        id: marketcaps
        continue-on-error: true
        run: node scripts/auto-refresh-market-caps.mjs

      - name: Refresh cash-flow data
        if: github.event.schedule != '25 22 * * 1-5' && !inputs.prices_only
        id: cashflow
        continue-on-error: true
        run: node scripts/auto-refresh-cash-flow.mjs

      - name: Refresh price-data.js
        id: prices
        continue-on-error: true
        run: node scripts/auto-refresh-price-data.mjs

      - name: Commit changes if data updated
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data.js price-data.js data/cash-flow-history.json data/cash-flow-coverage.json; then
            echo "No data update."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/version-pages-data.mjs .
          git add data.js price-data.js data/cash-flow-history.json data/cash-flow-coverage.json index.html
          git commit -m "chore(data): auto refresh dashboard datasets"
          git push
          # Explicitly publish bot commits; token pushes do not trigger Actions.
          gh workflow run pages.yml --ref main

      - name: Surface incomplete refreshes after publishing valid data
        if: always()
        env:
          FINANCIALS: ${{ steps.financials.outcome }}
          MARKETCAPS: ${{ steps.marketcaps.outcome }}
          CASHFLOW: ${{ steps.cashflow.outcome }}
          PRICES: ${{ steps.prices.outcome }}
        run: |
          echo "Financials: $FINANCIALS; market caps: $MARKETCAPS; cash flow: $CASHFLOW; prices: $PRICES" >> "$GITHUB_STEP_SUMMARY"
          test "$FINANCIALS" = success || test "$FINANCIALS" = skipped
          test "$MARKETCAPS" = success || test "$MARKETCAPS" = skipped
          test "$CASHFLOW" = success || test "$CASHFLOW" = skipped
          test "$PRICES" = success
