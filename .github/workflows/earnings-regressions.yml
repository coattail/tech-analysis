name: Earnings Pipeline Regression Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install beautifulsoup4
      - name: Run all dashboard and earnings regression tests
        run: |
          node --test tests/*.test.cjs
          python -m unittest discover -s tests -p 'test_*earnings_releases.py'
