name: Earnings Pipeline Regression Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check synchronization, units and financial source contracts
        run: |
          node --test tests/earnings-watch.test.cjs tests/amd-earnings.test.cjs tests/cash-flow.test.cjs
          python -m unittest discover -s tests -p 'test_resolve_earnings_releases.py'
