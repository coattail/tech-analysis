name: Watch All Company Earnings

on:
  schedule:
    - cron: "4 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  # Serialize with the existing daily market/history refresh.
  group: auto-refresh-data
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Synchronize and verify official earnings
        id: earnings
        continue-on-error: true
        uses: ./.github/actions/sync-earnings

      - name: Publish validated updates
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data.js data/cash-flow-history.json data/cash-flow-coverage.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/version-pages-data.mjs .
          git add index.html data.js data/cash-flow-history.json data/cash-flow-coverage.json
          git commit -m "chore(earnings): publish newly released quarterly data"
          python source-earnings/scripts/publish_earnings_data.py --workflow earnings-watch.yml --deploy-workflow pages.yml
      - name: Require successful earnings synchronization
        if: always()
        env:
          EARNINGS: ${{ steps.earnings.outcome }}
        run: test "$EARNINGS" = success
